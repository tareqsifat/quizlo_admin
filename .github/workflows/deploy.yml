# Builds the admin panel on the runner (npm run build = type-check + vite build),
# packs dist/ into an nginx image on GHCR, then rolls it out with no downtime.
#
# Secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, SSH_PORT (optional, default 22)
# Variables (optional): VITE_API_BASE_URL, default /api/v1 (same origin)
#                       INFRA_DIR, default /opt/quizlo/quizlo_infra

name: Deploy admin

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-admin
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/quizlo_admin

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails the release if types are broken; Vite inlines VITE_* at build time
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '/api/v1' }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build
    # Off switch: set the repo variable DEPLOY_ENABLED=true to let pushes deploy
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd "${{ vars.INFRA_DIR || '/opt/quizlo/quizlo_infra' }}"
            bash bin/release.sh admin ${{ github.sha }}
