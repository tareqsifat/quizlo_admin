server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Same limit as the backend's php.ini
    client_max_body_size 32m;

    # Same-origin API: lets the panel be built with VITE_API_BASE_URL=/api/v1
    # and keeps the backend off a public port (docker-compose.prod.yml).
    # Docker's DNS + a variable, so nginx still starts if the backend is down.
    resolver 127.0.0.11 valid=10s;
    location ~ ^/(api/|oauth/|up$) {
        set $backend http://backend:80;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Hashed build assets can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # vue-router uses history mode, so unknown paths fall back to the SPA
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
